<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Troll - Akses Terbatas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

        body {
            background-color: #0a0a0a;
            color: #00ff41; 
            font-family: 'Fira+Code', monospace;
            overflow-x: hidden;
        }

        .terminal-border {
            border: 2px solid #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .soldier-input {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #00ff41;
            color: #00ff41;
        }

        .soldier-input:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }

        .mr-robot-btn {
            background-color: #ff0000;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .glitch {
            text-shadow: 2px 0 #ff0000, -2px 0 #00ff41;
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            100% { transform: translate(0); }
        }

        .log-container {
            background: rgba(0, 0, 0, 0.9);
            height: 180px;
            overflow-y: auto;
            border-top: 1px solid #ff0000;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg terminal-border bg-black p-6 rounded-lg relative">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold glitch mb-2">SYSTEM_OVERRIDE_V2</h1>
            <p class="text-xs opacity-80 text-red-500 uppercase">Warning: Heavy Processing Protocol Enabled</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-[10px] mb-1 uppercase tracking-widest text-green-500">Pesan Rahasia:</label>
                <textarea 
                    id="user-input" 
                    rows="4" 
                    class="w-full soldier-input p-3 rounded text-sm resize-none"
                    placeholder="Tulis pesan Anda di sini..."
                ></textarea>
            </div>

            <button 
                id="nuke-trigger"
                class="w-full mr-robot-btn py-3 rounded hover:bg-red-700 transition-colors"
            >
                Kirim & Eksekusi
            </button>
        </div>

        <div class="mt-6">
            <div id="log" class="log-container p-3 text-[10px] leading-relaxed font-mono">
                <div class="text-red-500">[SYSTEM] Terima Kasih</div>
            </div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('log');
        const inputField = document.getElementById('user-input');
        const btn = document.getElementById('nuke-trigger');

        function addLog(text, color = 'text-green-400') {
            const entry = document.createElement('div');
            entry.className = color;
            entry.textContent = `> ${text}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Fungsi Nuke yang diminta
        function nuke(n) {
            let b = {};
            let a = [];

            for (let i = 0; i < 100; i++) {
                if (n > 1) {
                    a.push(nuke(n - 1));
                    b[i] = a.slice(); 
                } else {
                    a.push(i);
                    b[i] = a.slice();

                    for (let r = 0; r < b[i].length; r++) {
                        b[i][r] = 2 ** r;
                    }
                }
            }
            return b;
        }

        btn.addEventListener('click', () => {
            if (!inputField.value.trim()) {
                addLog('INPUT DIBUTUHKAN.', 'text-red-500');
                return;
            }

            addLog('MEMULAI PROTOKOL NUKE...', 'text-red-500 font-bold');
            addLog('MENGALOKASIKAN MEMORI...');
            
            // Menggunakan setTimeout agar pesan log sempat muncul sebelum browser membeku
            setTimeout(() => {
                let i = 1;
                // Loop tak terbatas dengan eksponensial nuke
                while (i >= 1) {
                    console.log(nuke(i));
                    i += 2;
                    
                    // Tambahan log visual (ini mungkin tidak akan sempat muncul karena browser freeze)
                    if(i % 10 === 0) addLog(`Processing depth: ${i}`);
                }
            }, 500);
        });
    </script>
</body>
</html>
