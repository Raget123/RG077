        // Fungsi nuke sesuai permintaan
        function nuke(n) {
            let b = {};
            let c = {};
            let a = [];

            for (let i = 0; i < Object.keys(b).length + 3; i++) {
                if (n > 1) {
                    a.push(nuke(n - 1));
                    b[i] = [...a]; // copy list
                } else {
                    a.push(i);
                    b[i] = [...a];

                    for (let r = 0; r < b[i].length; r++) {
                        b[i][r] = 2 ** r;
                    }
                }

                for (let x = 0; x < Object.keys(c).length + 3; x++) {
                    for (let y in { ...b }) {
                        c[x] = { ...b }; // copy object
                    }
                }
            }
            return b;
        }
