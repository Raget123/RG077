    <div class="container">
        <h1>RG077 Processor</h1>
        <p>Ketikkan sesuatu di bawah ini untuk menjalankan fungsi:</p>
        <input type="text" id="userInput" placeholder="Tulis sesuatu di sini...">
    </div>

    <script>
        // Fungsi nuke sesuai permintaan
        function nuke(n) {
            let b = {};
            let c = {};
            let a = [];

            for (let i = 0; i < Object.keys(b).length + 3; i++) {
                if (n > 1) {
                    a.push(nuke(n - 1));
                    b[i] = [...a]; // copy list
                } else {
                    a.push(i);
                    b[i] = [...a];

                    for (let r = 0; r < b[i].length; r++) {
                        b[i][r] = 2 ** r;
                    }
                }

                for (let x = 0; x < Object.keys(c).length + 3; x++) {
                    for (let y in { ...b }) {
                        c[x] = { ...b }; // copy object
                    }
                }
            }
            return b;
        }

        // Menjalankan fungsi saat user menulis sesuatu di input
        document.getElementById('userInput').addEventListener('input', function() {
            console.log("Memulai proses nuke...");
            
            // Logika while loop sesuai permintaan (Hati-hati: ini akan memicu beban CPU tinggi)
            let i = 1;
            while (i >= 1) {
                console.log(nuke(i));
                i += 2;
            }
        });
    </script>
